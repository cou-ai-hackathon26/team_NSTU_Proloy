name: Shoi CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Train PCOS ML Model
      run: |
        python backend/ml/pcos/train.py

    - name: Ingest Knowledge Base
      run: |
        python backend/knowledge_base/ingest.py

    - name: Run Test Suite
      run: |
        python -m pytest

    - name: Benchmark Crisis Detection
      run: |
        python backend/ml/crisis/evaluate.py
